services:
  postgres:
    image: postgres:16-alpine
    container_name: harbor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-harbor_db}
    volumes:
      - harbor_pg_data:/var/lib/postgresql/data
      - ./database/docker-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-harbor_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./src/harbor-backend
    container_name: harbor-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5001
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-admin}
      PGDATABASE: ${POSTGRES_DB:-harbor_db}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://93.77.164.66}
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: harbor-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./deploy/nginx/harbor.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  harbor_pg_data:
