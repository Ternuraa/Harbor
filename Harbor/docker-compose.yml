services:
  postgres:
    image: postgres:16-alpine
    container_name: harbor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: harbor_db
    ports:
      - "5433:5432"
    volumes:
      - harbor_pg_data:/var/lib/postgresql/data
      - ./database/docker-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d harbor_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  harbor_pg_data:
